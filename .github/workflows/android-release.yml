name: Build Signed Android AAB (Bible Blitz)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode Android keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks

      # ✅ Auto-find the correct Gradle project folder (no more path guessing)
      - name: Locate Gradle project (find gradlew)
        id: locate
        shell: bash
        run: |
          set -e
          echo "Searching for gradlew..."
          GRADLEW_PATH="$(find . -maxdepth 5 -type f -name gradlew | head -n 1)"
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ gradlew not found anywhere in repo!"
            echo "Here is the folder tree (top 4 levels):"
            find . -maxdepth 4 -type d
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW_PATH")"
          echo "✅ Found gradlew at: $GRADLEW_PATH"
          echo "✅ Using project dir: $PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Build signed AAB
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew clean bundleRelease \
            -Pandroid.injected.signing.store.file=$KEYSTORE_FILE \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: BibleBlitz-SIGNED-AAB
          path: "**/app/build/outputs/bundle/release/*.aab"
