name: Build Signed Android AAB (Bible Blitz)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Decode Android keystore
        working-directory: bible-blitz-android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks

      - name: Create keystore.properties
        working-directory: bible-blitz-android
        run: |
          echo "storeFile=upload-keystore.jks" > keystore.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties

      - name: Make gradlew executable
        working-directory: bible-blitz-android
        run: chmod +x gradlew

      - name: Build signed AAB
        working-directory: bible-blitz-android
        run: ./gradlew clean bundleRelease

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: BibleBlitz-SIGNED-AAB
          path: bible-blitz-android/app/build/outputs/bundle/release/*.aab
