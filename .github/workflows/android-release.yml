name: Build Signed Android AAB (Bible Blitz)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode Android keystore (safe)
        shell: bash
        run: |
          set -e
          rm -f upload-keystore.jks
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks
          ls -lah upload-keystore.jks

      - name: Verify keystore is valid
        shell: bash
        run: |
          set -e
          # Try JKS first, then PKCS12 (prints one of them working)
          if keytool -list -keystore upload-keystore.jks -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -storetype JKS >/dev/null 2>&1; then
            echo "STORE_TYPE=JKS" >> $GITHUB_ENV
            echo "✅ Keystore verified as JKS"
          elif keytool -list -keystore upload-keystore.jks -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -storetype PKCS12 >/dev/null 2>&1; then
            echo "STORE_TYPE=PKCS12" >> $GITHUB_ENV
            echo "✅ Keystore verified as PKCS12"
          else
            echo "❌ Keystore password/type invalid OR secret is not a real keystore."
            exit 1
          fi

      - name: Build signed AAB
        working-directory: daily-bible-quiz-android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_TYPE: ${{ env.STORE_TYPE }}
        shell: bash
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew clean bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            -Pandroid.injected.signing.store.type="$STORE_TYPE"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: BibleBlitz-SIGNED-AAB
          path: daily-bible-quiz-android/app/build/outputs/bundle/release/*.aab
