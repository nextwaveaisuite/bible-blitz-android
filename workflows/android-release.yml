name: Build Signed Android AAB (Bible Blitz)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Decode Android keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks

      - name: Create keystore.properties
        run: |
          echo "storeFile=../upload-keystore.jks" > daily-bible-quiz-android/keystore.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> daily-bible-quiz-android/keystore.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> daily-bible-quiz-android/keystore.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> daily-bible-quiz-android/keystore.properties

      - name: Build signed AAB
        working-directory: daily-bible-quiz-android
        run: ./gradlew clean bundleRelease

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: BibleBlitz-SIGNED-AAB
          path: daily-bible-quiz-android/app/build/outputs/bundle/release/*.aab
